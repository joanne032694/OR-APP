<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班表查詢系統</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary: #1e88e5;
  --bg: #f5f5f5;
  --text: #333;
  --border: #ddd;
  --error: #e53935;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: var(--text);
  padding: 10px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-screen {
  width: 100%;
  max-width: 400px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  padding: 40px 30px;
  text-align: center;
  display: flex;
}

.login-screen.hidden {
  display: none;
}

.app-screen {
  display: none;
  width: 100%;
  background: white;
  min-height: 100vh;
  padding: 20px;
}

.app-screen.visible {
  display: block;
}

/* ============ LOGIN SCREEN ============ */
.login-icon {
  font-size: 48px;
  margin-bottom: 20px;
}

.login-screen h1 {
  color: var(--primary);
  margin-bottom: 10px;
  font-size: 24px;
}

.login-screen .subtitle {
  color: #999;
  font-size: 13px;
  margin-bottom: 30px;
}

.form-group {
  margin-bottom: 15px;
  text-align: left;
}

.form-group label {
  display: block;
  font-weight: bold;
  color: #555;
  margin-bottom: 6px;
  font-size: 14px;
}

.form-group input {
  width: 100%;
  padding: 12px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  transition: 0.3s;
}

.form-group input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 8px rgba(30, 136, 229, 0.2);
}

.error-msg {
  background: #ffebee;
  color: var(--error);
  padding: 10px;
  border-radius: 4px;
  font-size: 13px;
  margin-bottom: 15px;
  display: none;
}

.error-msg.show {
  display: block;
}

.login-button {
  width: 100%;
  padding: 12px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
  margin-top: 10px;
}

.login-button:hover {
  background: #1565c0;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(30, 136, 229, 0.3);
}

.hint {
  font-size: 12px;
  color: #999;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

/* ============ APP SCREEN ============ */
.container {
  max-width: 1000px;
  margin: 0 auto;
  background: white;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  padding: 20px;
}

.app-screen h1 {
  text-align: center;
  color: var(--primary);
  margin-bottom: 10px;
  font-size: 24px;
}

.app-screen .subtitle {
  text-align: center;
  color: #999;
  font-size: 13px;
  margin-bottom: 20px;
}

.user-info {
  background: #e3f2fd;
  padding: 12px;
  border-left: 4px solid var(--primary);
  border-radius: 4px;
  margin-bottom: 15px;
  font-size: 13px;
}

.control-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: center;
}

.control-bar select {
  padding: 10px;
  border: 1.5px solid var(--border);
  border-radius: 4px;
  font-size: 14px;
  font-weight: bold;
}

.control-bar button {
  padding: 10px 16px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

.control-bar button:hover {
  background: #1565c0;
}

.control-bar button.logout {
  background: var(--error);
  margin-left: auto;
}

.control-bar button.logout:hover {
  background: #c62828;
}

/* ============ CALENDAR GRID ============ */
.calendar-wrapper {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.week-label {
  text-align: center;
  font-size: 12px;
  font-weight: bold;
  color: #666;
  margin-top: 10px;
  margin-bottom: 5px;
}

.week-label:first-child {
  margin-top: 0;
}

.day-labels {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  margin-bottom: 10px;
}

.day-name {
  text-align: center;
  font-size: 12px;
  font-weight: bold;
  color: white;
  background: var(--primary);
  padding: 8px;
  border-radius: 4px;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  margin-bottom: 15px;
}

.day-cell {
  aspect-ratio: 1;
  border: 1.5px solid var(--border);
  border-radius: 4px;
  padding: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 13px;
  font-weight: bold;
  cursor: default;
  background: white;
  position: relative;
  transition: 0.2s;
}

.day-cell:hover {
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.day-cell .date {
  font-size: 11px;
  color: #999;
  display: block;
  margin-bottom: 2px;
}

.day-cell .shift {
  font-size: 14px;
  display: block;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 班别颜色 */
.day-cell.D {
  background: #c8e6c9;
  color: #1b5e20;
  border-color: #81c784;
}

.day-cell.E {
  background: #ffe0b2;
  color: #e65100;
  border-color: #ffb74d;
}

.day-cell.N {
  background: #b3e5fc;
  color: #01579b;
  border-color: #4fc3f7;
}

.day-cell.休 {
  background: #f8bbd0;
  color: #880e4f;
  border-color: #f48fb1;
}

.day-cell.例 {
  background: #ede7f6;
  color: #4a148c;
  border-color: #ce93d8;
}

.day-cell.國 {
  background: #fff9c4;
  color: #f57f17;
  border-color: #fff59d;
}

.day-cell.V {
  background: #ffccbc;
  color: #bf360c;
  border-color: #ffab91;
}

.day-cell.產 {
  background: #d1c4e9;
  color: #311b92;
  border-color: #b39ddb;
}

.day-cell.安 {
  background: #c8e6c9;
  color: #1b5e20;
  border-color: #81c784;
}

.day-cell.empty {
  background: #fafafa;
  border-color: #eee;
  cursor: not-allowed;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  margin-top: 20px;
  padding: 15px;
  background: #fafafa;
  border-radius: 4px;
  font-size: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.legend-box {
  width: 20px;
  height: 20px;
  border-radius: 3px;
  border: 1px solid #ccc;
}

.no-data {
  text-align: center;
  padding: 40px;
  color: #999;
  font-size: 14px;
}

@media (max-width: 768px) {
  .container {
    padding: 15px;
  }
  
  h1 {
    font-size: 20px;
  }
  
  .day-cell {
    font-size: 12px;
  }
  
  .day-cell .date {
    font-size: 10px;
  }
  
  .day-cell .shift {
    font-size: 13px;
  }
}
</style>
</head>

let currentUser = null;

function handleLogin() {
  const password = document.getElementById('passwordInput').value;
  const empId = document.getElementById('empIdInput').value.trim();
  const errorMsg = document.getElementById('errorMsg');
  
  if (!password) {
    showError(errorMsg, '❌ 請輸入密碼');
    return;
  }
  
  if (password !== CORRECT_PASSWORD) {
    showError(errorMsg, '❌ 密碼錯誤');
    document.getElementById('passwordInput').value = '';
    return;
  }
  
  if (!empId) {
    showError(errorMsg, '❌ 請輸入員編');
    return;
  }
  
  if (!EMPLOYEE_DB[empId]) {
    showError(errorMsg, '❌ 員編不存在');
    document.getElementById('empIdInput').value = '';
    return;
  }
  
  currentUser = {
    id: empId,
    name: EMPLOYEE_DB[empId]
  };
  
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.add('visible');
  document.getElementById('userInfo').innerHTML = `
    👋 歡迎，<strong>${currentUser.name}</strong>（員編：${currentUser.id}）
  `;
}

function showError(element, message) {
  element.textContent = message;
  element.classList.add('show');
}

function handleLogout() {
  if (confirm('確定要登出嗎？')) {
    currentUser = null;
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('appScreen').classList.remove('visible');
    document.getElementById('passwordInput').value = '';
    document.getElementById('empIdInput').value = '';
    document.getElementById('errorMsg').classList.remove('show');
    document.getElementById('monthSelect').value = '';
    document.getElementById('passwordInput').focus();
  }
}

function loadCalendar() {
  const month = document.getElementById('monthSelect').value;
  const container = document.getElementById('calendarContainer');
  
  if (!month) {
    container.innerHTML = '<div class="no-data">請選擇月份</div>';
    return;
  }
  
  const scheduleData = month === '8' ? SCHEDULE_8 : SCHEDULE_9;
  
  if (!scheduleData[currentUser.name]) {
    container.innerHTML = `<div class="no-data">❌ 找不到班表數據</div>`;
    return;
  }
  
  const daysInMonth = month === '8' ? 31 : 30;
  const monthName = month === '8' ? '8月' : '9月';
  
  document.getElementById('monthTitle').textContent = `${monthName} - ${currentUser.name}`;
  
  // 获取第一天是星期几
  const firstDate = new Date(2024, month - 1, 1);
  const firstDayOfWeek = firstDate.getDay();
  
  const personalSchedule = scheduleData[currentUser.name];
  
  let html = '<div class="calendar-wrapper">';
  html += '<div class="day-labels">';
  WEEKDAYS.forEach(day => {
    html += `<div class="day-name">${day}</div>`;
  });
  html += '</div>';
  
  // 添加前面的空天数
  let dayCounter = 1;
  let weekCount = 0;
  
  for (let i = 0; i < firstDayOfWeek; i++) {
    if (weekCount === 0 && i === 0) {
      html += '<div class="calendar-grid">';
    }
    html += '<div class="day-cell empty"></div>';
    dayCounter++;
  }
  
  // 添加日期单元格
  for (let day = 1; day <= daysInMonth; day++) {
    if ((dayCounter - 1) % 7 === 0) {
      if (dayCounter > 1) {
        html += '</div>'; // 结束前一周
      }
      html += '<div class="calendar-grid">'; // 开始新的一周
      weekCount++;
    }
    
    const shift = personalSchedule[day.toString()] || '';
    const shiftClass = getShiftClass(shift);
    const dateDisplay = new Date(2024, month - 1, day).getDate();
    
    html += `
      <div class="day-cell ${shiftClass}">
        <span class="date">${dateDisplay}</span>
        <span class="shift">${shift}</span>
      </div>
    `;
    dayCounter++;
  }
  
  // 添加后面的空天数补齐最后一行
  while ((dayCounter - 1) % 7 !== 0) {
    html += '<div class="day-cell empty"></div>';
    dayCounter++;
  }
  
  html += '</div>'; // 结束最后一周
  html += '</div>'; // 结束calendar-wrapper
  
  // 添加图例
  html += `
    <div class="legend">
      <div class="legend-item"><div class="legend-box D"></div> D = 白班</div>
      <div class="legend-item"><div class="legend-box E"></div> E = 小夜班</div>
      <div class="legend-item"><div class="legend-box N"></div> N = 大夜班</div>
      <div class="legend-item"><div class="legend-box 休"></div> 休 = 休息</div>
      <div class="legend-item"><div class="legend-box 例"></div> 例 = 例假</div>
      <div class="legend-item"><div class="legend-box 國"></div> 國 = 國假</div>
      <div class="legend-item"><div class="legend-box V"></div> V = 婚喪病</div>
      <div class="legend-item"><div class="legend-box 產"></div> 產 = 產假</div>
    </div>
  `;
  
  container.innerHTML = html;
}

function getShiftClass(shift) {
  if (!shift) return '';
  const type = shift.replace(/[0-9★]/g, '').trim();
  return type || '';
}

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('passwordInput').focus();
});
</script>
