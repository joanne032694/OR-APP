<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班表查詢系統</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary: #1e88e5;
  --success: #43a047;
  --danger: #e53935;
  --warning: #fb8c00;
  --bg: #f5f5f5;
  --text: #333;
  --border: #ddd;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 10px;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  background: white;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  padding: 20px;
}

h1 {
  text-align: center;
  color: var(--primary);
  margin-bottom: 20px;
  font-size: 28px;
}

.controls {
  display: flex;
  gap: 15px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
}

.control-group {
  display: flex;
  gap: 10px;
  align-items: center;
}

.control-group label {
  font-weight: bold;
  color: #555;
}

select, input {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 14px;
}

button {
  padding: 8px 16px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  background: #1565c0;
}

.pwd-prompt {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  z-index: 1000;
}

.pwd-prompt input {
  width: 200px;
  padding: 10px;
  margin: 10px 0;
}

.pwd-prompt button {
  margin-right: 10px;
}

.overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.3);
  z-index: 999;
}

.overlay.show {
  display: block;
}

.pwd-prompt.show {
  display: block;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  font-size: 13px;
}

table th {
  background: var(--primary);
  color: white;
  padding: 12px;
  text-align: left;
  font-weight: bold;
  position: sticky;
  top: 0;
}

table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}

table tr:nth-child(even) {
  background: #fafafa;
}

table tr:hover {
  background: #f0f0f0;
}

.D { background: #c8e6c9; color: #1b5e20; }
.E { background: #ffe0b2; color: #e65100; }
.N { background: #b3e5fc; color: #01579b; }
.休 { background: #f8bbd0; color: #880e4f; }
.例 { background: #ede7f6; color: #4a148c; }
.國 { background: #fff9c4; color: #f57f17; }
.V { background: #ffccbc; color: #bf360c; }
.產 { background: #d1c4e9; color: #311b92; }
.安 { background: #c8e6c9; color: #1b5e20; }

.no-data {
  text-align: center;
  padding: 40px;
  color: #999;
  font-size: 16px;
}

.info {
  background: #e3f2fd;
  padding: 10px;
  border-left: 4px solid var(--primary);
  margin-bottom: 15px;
  border-radius: 4px;
  font-size: 13px;
}

.password-hint {
  font-size: 12px;
  color: #999;
  margin-top: 5px;
}

@media (max-width: 768px) {
  .controls {
    flex-direction: column;
  }
  
  select, input {
    width: 100%;
  }
  
  table {
    font-size: 12px;
  }
  
  table td {
    padding: 8px;
  }
}
</style>
</head>
<body>

<div class="container">
  <h1>🏥 班表查詢系統</h1>
  
  <div class="info">
    ℹ️ 輸入密碼可查詢所有月份。不輸入密碼只能查詢8月和9月。
    <div class="password-hint">密碼提示：A030</div>
  </div>
  
  <div class="controls">
    <div class="control-group">
      <label>查詢月份：</label>
      <select id="monthSelect" onchange="loadSchedule()">
        <option value="">-- 選擇月份 --</option>
        <option value="8">8月</option>
        <option value="9">9月</option>
      </select>
    </div>
    
    <div class="control-group">
      <label>查詢名字：</label>
      <input type="text" id="nameSearch" placeholder="輸入員工名字" onkeyup="filterTable()">
    </div>
    
    <button onclick="showPasswordPrompt()">🔐 管理員登入</button>
    <button onclick="resetForm()">清除</button>
  </div>
  
  <div id="tableContainer"></div>
</div>

<!-- 密碼提示 -->
<div class="overlay" id="overlay" onclick="closePasswordPrompt()"></div>
<div class="pwd-prompt" id="pwdPrompt">
  <h3>管理員登入</h3>
  <input type="password" id="pwdInput" placeholder="輸入密碼" onkeypress="if(event.key==='Enter') checkPassword()">
  <div>
    <button onclick="checkPassword()">確認</button>
    <button onclick="closePasswordPrompt()" style="background: #999;">取消</button>
  </div>
</div>

function showPasswordPrompt() {
  document.getElementById('overlay').classList.add('show');
  document.getElementById('pwdPrompt').classList.add('show');
  document.getElementById('pwdInput').focus();
}

function closePasswordPrompt() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('pwdPrompt').classList.remove('show');
  document.getElementById('pwdInput').value = '';
}

function checkPassword() {
  const pwd = document.getElementById('pwdInput').value;
  if (pwd === CORRECT_PASSWORD) {
    isAuthenticated = true;
    // 解锁所有月份
    alert('✅ 登入成功！');
    closePasswordPrompt();
    // 重新加载月份选择
    location.reload();
  } else {
    alert('❌ 密碼錯誤');
    document.getElementById('pwdInput').value = '';
  }
}

function loadSchedule() {
  const month = document.getElementById('monthSelect').value;
  const container = document.getElementById('tableContainer');
  
  if (!month) {
    container.innerHTML = '<div class="no-data">請選擇月份</div>';
    return;
  }
  
  // 检查权限
  if (month !== '8' && month !== '9' && !isAuthenticated) {
    alert('請先輸入密碼');
    showPasswordPrompt();
    document.getElementById('monthSelect').value = '';
    return;
  }
  
  const scheduleData = month === '8' ? SCHEDULE_8 : SCHEDULE_9;
  
  if (!scheduleData || Object.keys(scheduleData).length === 0) {
    container.innerHTML = '<div class="no-data">暫無' + month + '月班表數據</div>';
    return;
  }
  
  let html = '<table><thead><tr><th>名字</th>';
  const daysInMonth = month === '8' ? 31 : 30;
  for (let i = 1; i <= daysInMonth; i++) {
    html += '<th>' + i + '</th>';
  }
  html += '</tr></thead><tbody>';
  
  for (const [name, schedule] of Object.entries(scheduleData)) {
    html += '<tr><td><strong>' + name + '</strong></td>';
    for (let day = 1; day <= daysInMonth; day++) {
      const shift = schedule[day.toString()] || '';
      const cssClass = shift.replace(/[0-9★]/g, '').trim();
      html += '<td class="' + cssClass + '">' + shift + '</td>';
    }
    html += '</tr>';
  }
  
  html += '</tbody></table>';
  container.innerHTML = html;
}

function filterTable() {
  const searchName = document.getElementById('nameSearch').value.toLowerCase();
  const rows = document.querySelectorAll('table tbody tr');
  
  rows.forEach(row => {
    const name = row.cells[0].textContent.toLowerCase();
    row.style.display = name.includes(searchName) ? '' : 'none';
  });
}

function resetForm() {
  document.getElementById('monthSelect').value = '';
  document.getElementById('nameSearch').value = '';
  document.getElementById('tableContainer').innerHTML = '<div class="no-data">請選擇月份</div>';
}
