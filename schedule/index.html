
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手術室班表查詢 - 7月至9月</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans TC',sans-serif;background:#f5f5f5;padding:20px;}
.container{max-width:900px;margin:0 auto;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
.header{background:#1a56a0;color:#fff;padding:20px;text-align:center;border-radius:8px 8px 0 0;}
.header h1{font-size:28px;margin-bottom:5px;}
.header p{font-size:14px;opacity:0.9;}
.login{padding:40px;text-align:center;}
.login input{
  width:100%;max-width:300px;padding:12px;margin:10px 0;
  font-size:16px;border:2px solid #ddd;border-radius:6px;
}
.login button{
  background:#1a56a0;color:#fff;padding:12px 30px;
  font-size:16px;border:none;border-radius:6px;cursor:pointer;margin-top:10px;
}
.login button:hover{background:#0f3778;}
.error{color:red;font-size:14px;margin-top:10px;display:none;}
.profile{background:#f9f9f9;padding:20px;margin:20px;border-radius:6px;display:none;}
.profile h2{color:#1a56a0;margin-bottom:10px;}
.profile-info{display:flex;justify-content:space-between;align-items:center;}
.logout-btn{background:#999;padding:8px 16px;font-size:14px;border:none;border-radius:6px;cursor:pointer;color:white;}
.logout-btn:hover{background:#777;}
.calendar{display:none;padding:20px;}

.month-nav{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;background:#f0f4f8;padding:15px;border-radius:6px;
}
.month-nav button{
  background:#1a56a0;color:#fff;border:none;padding:10px 15px;
  border-radius:6px;cursor:pointer;font-size:14px;
}
.month-nav button:hover{background:#0f3778;}
.month-nav button:disabled{background:#ccc;cursor:not-allowed;}
.month-nav h2{color:#1a56a0;font-size:20px;margin:0 20px;min-width:120px;text-align:center;}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px;}
.stat-box{background:#f0f4f8;padding:15px;border-radius:6px;text-align:center;}
.stat-box .num{font-size:24px;font-weight:bold;color:#1a56a0;}
.stat-box .label{font-size:12px;color:#666;margin-top:5px;}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.cal-header{background:#1a56a0;color:#fff;padding:10px;text-align:center;font-weight:bold;}
.cal-day{
  border:2px solid #ddd;border-radius:6px;padding:10px;
  text-align:center;cursor:pointer;min-height:80px;
  display:flex;flex-direction:column;justify-content:flex-start;
  background:#fff;transition:0.2s;
}
.cal-day:hover{background:#f0f4f8;border-color:#1a56a0;}
.cal-day.empty{background:#fafbfc;cursor:default;border:none;}
.cal-day .date{font-weight:bold;margin-bottom:5px;font-size:16px;}
.cal-day .shift{font-size:13px;font-weight:bold;padding:4px 6px;border-radius:4px;margin:2px 0;word-break:break-word;}

.shift-D{background:#e8f0fa;color:#1a56a0;}
.shift-E{background:#f3e8ff;color:#6b21a8;}
.shift-N{background:#fdf2f8;color:#be185d;}
.shift-128{background:#fef3cd;color:#b45309;}
.shift-off{background:#fee2e2;color:#c0392b;}
.shift-other{background:#fef9c3;color:#92400e;}

.legend{background:#f9f9f9;padding:15px;margin:20px;border-radius:6px;font-size:13px;}
.legend-item{display:inline-block;margin-right:20px;margin-top:5px;}
.star{color:#b45309;font-weight:bold;}

.no-data{text-align:center;padding:40px;color:#999;}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📅 手術室班表查詢系統</h1>
    <p>115年 7月・8月・9月班表</p>
  </div>

  <div class="login" id="loginArea">
    <h2>登入查詢</h2>
    <input type="password" id="password" placeholder="輸入通用密碼" />
    <input type="text" id="empId" placeholder="輸入員編" inputmode="numeric" />
    <br/>
    <button onclick="login()">查詢班表</button>
    <div class="error" id="error"></div>
  </div>

  <div class="profile" id="profileArea">
    <div class="profile-info">
      <div>
        <h2 id="empName"></h2>
        <p>員編: <span id="empIdDisplay"></span></p>
      </div>
      <button class="logout-btn" onclick="logout()">↩ 登出</button>
    </div>
  </div>

  <div class="calendar" id="calendarArea">
    <div class="month-nav">
      <button id="prevBtn" onclick="prevMonth()">◀ 上一月</button>
      <h2 id="monthTitle">115年9月</h2>
      <button id="nextBtn" onclick="nextMonth()">下一月 ▶</button>
    </div>
    
    <div class="stats" id="stats"></div>

    <div style="text-align:center;margin-bottom:10px;font-size:13px;color:#666;">
      （點擊日期查看詳細班別）
    </div>

    <div class="cal-grid" id="calGrid"></div>

    <div class="legend">
      <strong>班別說明：</strong><br/>
      <div class="legend-item" style="background:#e8f0fa;padding:3px 8px;border-radius:3px;">D = 白班</div>
      <div class="legend-item" style="background:#f3e8ff;padding:3px 8px;border-radius:3px;">E = 小夜</div>
      <div class="legend-item" style="background:#fdf2f8;padding:3px 8px;border-radius:3px;">N = 大夜</div>
      <div class="legend-item" style="background:#fef3cd;padding:3px 8px;border-radius:3px;">12-8 = 12-8班</div>
      <div class="legend-item" style="background:#fee2e2;padding:3px 8px;border-radius:3px;">休/例/國 = 放假</div>
      <div class="legend-item"><span class="star">★</span> = 控台</div>
    </div>
  </div>
</div>

// 7月和8月暫時用空數據
const SCHEDULE_7 = {};
const SCHEDULE_8 = {};
const SCHEDULE_9 = SCHEDULE_9;

const SCHEDULES = {
  7: SCHEDULE_7,
  8: SCHEDULE_8,
  9: SCHEDULE_9
};

const MONTH_LABELS = {
  7: '115年7月',
  8: '115年8月',
  9: '115年9月'
};

let currentEmp = null;
let currentName = null;
let currentMonth = 9;

function getShiftClass(shift) {
  if (!shift) return 'shift-off';
  const s = String(shift).trim();
  if (s.includes('E')) return 'shift-E';
  if (s.includes('N')) return 'shift-N';
  if (s === '12-8') return 'shift-128';
  if (s.includes('D')) return 'shift-D';
  if (['休','例','國','公','婚','喪','產','V'].includes(s)) return 'shift-off';
  return 'shift-other';
}

function getShiftDisplay(shift) {
  if (!shift) return '—';
  const s = String(shift).trim();
  if (s.includes('★')) return s.replace('★','') + ' <span class="star">★</span>';
  return s;
}

function getDaysInMonth(month) {
  if (month === 7) return 31;
  if (month === 8) return 31;
  if (month === 9) return 30;
  return 30;
}

function getFirstDayOfMonth(month) {
  const date = new Date(2026, month - 1, 1);
  return date.getDay();
}

function login() {
  const pw = document.getElementById('password').value;
  const id = document.getElementById('empId').value;
  const err = document.getElementById('error');
  
  if (pw !== SHARED_PASSWORD) {
    err.textContent = '密碼錯誤！';
    err.style.display = 'block';
    return;
  }
  
  if (!EMP_NAMES[id]) {
    err.textContent = '員編不存在！';
    err.style.display = 'block';
    return;
  }
  
  currentEmp = id;
  currentName = EMP_NAMES[id];
  err.style.display = 'none';
  
  document.getElementById('loginArea').style.display = 'none';
  document.getElementById('profileArea').style.display = 'block';
  document.getElementById('calendarArea').style.display = 'block';
  document.getElementById('empName').textContent = '👤 ' + currentName;
  document.getElementById('empIdDisplay').textContent = id;
  
  currentMonth = 9;
  renderCalendar();
}

function logout() {
  currentEmp = null;
  currentName = null;
  document.getElementById('password').value = '';
  document.getElementById('empId').value = '';
  document.getElementById('loginArea').style.display = 'block';
  document.getElementById('profileArea').style.display = 'none';
  document.getElementById('calendarArea').style.display = 'none';
}

function prevMonth() {
  if (currentMonth > 7) {
    currentMonth--;
    renderCalendar();
  }
}

function nextMonth() {
  if (currentMonth < 9) {
    currentMonth++;
    renderCalendar();
  }
}

function renderCalendar() {
  const sched = SCHEDULES[currentMonth][currentName] || {};
  const daysInMonth = getDaysInMonth(currentMonth);
  const firstDay = getFirstDayOfMonth(currentMonth);
  
  // 更新按鈕狀態
  document.getElementById('prevBtn').disabled = currentMonth === 7;
  document.getElementById('nextBtn').disabled = currentMonth === 9;
  
  // 更新月份標題
  document.getElementById('monthTitle').textContent = MONTH_LABELS[currentMonth];
  
  let countD = 0, countE = 0, countN = 0, countOff = 0, countStar = 0;
  
  for (let i = 1; i <= daysInMonth; i++) {
    const shift = sched[i];
    if (!shift) continue;
    const s = String(shift).trim();
    if (s.includes('★')) countStar++;
    if (s.includes('D') && !s.includes('E') && !s.includes('N')) countD++;
    else if (s.includes('E')) countE++;
    else if (s.includes('N')) countN++;
    else if (['休','例','國','公','婚','喪','產','V'].includes(s)) countOff++;
  }
  
  document.getElementById('stats').innerHTML = `
    <div class="stat-box"><div class="num">${countD}</div><div class="label">白班</div></div>
    <div class="stat-box"><div class="num">${countE + countN}</div><div class="label">小/大夜</div></div>
    <div class="stat-box"><div class="num">${countStar}</div><div class="label">控台次數</div></div>
    <div class="stat-box"><div class="num">${countOff}</div><div class="label">休假</div></div>
  `;
  
  let html = '';
  const dayNames = ['日','一','二','三','四','五','六'];
  
  // 日期標題
  for (let i = 0; i < 7; i++) {
    html += `<div class="cal-header">${dayNames[i]}</div>`;
  }
  
  // 空白日期
  for (let i = 0; i < firstDay; i++) {
    html += '<div class="cal-day empty"></div>';
  }
  
  // 日期
  for (let i = 1; i <= daysInMonth; i++) {
    const shift = sched[i] || '—';
    const shiftClass = getShiftClass(shift);
    const shiftDisplay = getShiftDisplay(shift);
    html += `
      <div class="cal-day" onclick="alert('${currentMonth}月${i}日\\n班別：${shift}')">
        <div class="date">${i}</div>
        <div class="shift ${shiftClass}">${shiftDisplay}</div>
      </div>
    `;
  }
  
  // 末尾空白
  const totalCells = firstDay + daysInMonth;
  const remain = (7 - (totalCells % 7)) % 7;
  for (let i = 0; i < remain; i++) {
    html += '<div class="cal-day empty"></div>';
  }
  
  document.getElementById('calGrid').innerHTML = html;
}
</script>
</body>
</html>
