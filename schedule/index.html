<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班表查詢系統</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary: #1e88e5;
  --error: #e53935;
  --text: #333;
  --border: #ddd;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: var(--text);
  padding: 10px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-screen {
  width: 100%;
  max-width: 400px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  padding: 40px 30px;
  text-align: center;
  display: flex;
}

.login-screen.hidden {
  display: none;
}

.app-screen {
  display: none;
  width: 100%;
  max-width: 1000px;
  background: white;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  padding: 20px;
}

.app-screen.visible {
  display: block;
}

.login-icon {
  font-size: 48px;
  margin-bottom: 20px;
}

.login-screen h1 {
  color: var(--primary);
  margin-bottom: 10px;
  font-size: 24px;
}

.login-screen .subtitle {
  color: #999;
  font-size: 13px;
  margin-bottom: 30px;
}

.form-group {
  margin-bottom: 15px;
  text-align: left;
}

.form-group label {
  display: block;
  font-weight: bold;
  color: #555;
  margin-bottom: 6px;
  font-size: 14px;
}

.form-group input {
  width: 100%;
  padding: 12px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  transition: 0.3s;
}

.form-group input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 8px rgba(30, 136, 229, 0.2);
}

.error-msg {
  background: #ffebee;
  color: var(--error);
  padding: 10px;
  border-radius: 4px;
  font-size: 13px;
  margin-bottom: 15px;
  display: none;
  border-left: 4px solid var(--error);
}

.error-msg.show {
  display: block;
}

.login-button {
  width: 100%;
  padding: 12px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
  margin-top: 10px;
}

.login-button:hover {
  background: #1565c0;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(30, 136, 229, 0.3);
}

.hint {
  font-size: 12px;
  color: #999;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  line-height: 1.6;
}

.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.app-header h1 {
  color: var(--primary);
  font-size: 24px;
}

.header-controls {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

.month-selector {
  display: flex;
  gap: 8px;
  align-items: center;
}

.month-selector label {
  font-weight: bold;
  color: #555;
  font-size: 14px;
}

.month-selector select {
  padding: 8px 12px;
  border: 1.5px solid var(--border);
  border-radius: 4px;
  font-size: 14px;
  background: white;
  cursor: pointer;
  transition: 0.3s;
}

.month-selector select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 8px rgba(30, 136, 229, 0.2);
}

.logout-btn {
  padding: 8px 16px;
  background: var(--error);
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
  font-size: 14px;
}

.logout-btn:hover {
  background: #c62828;
  transform: translateY(-2px);
}

.user-info {
  background: #e3f2fd;
  padding: 12px;
  border-left: 4px solid var(--primary);
  border-radius: 4px;
  margin-bottom: 15px;
  font-size: 13px;
}

.calendar-wrapper {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.day-labels {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  margin-bottom: 8px;
}

.day-name {
  text-align: center;
  font-size: 12px;
  font-weight: bold;
  color: white;
  background: var(--primary);
  padding: 6px 2px;
  border-radius: 3px;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  margin-bottom: 12px;
}

.day-cell {
  aspect-ratio: 1;
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 2px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 12px;
  font-weight: bold;
  cursor: default;
  background: white;
  overflow: hidden;
  transition: 0.2s;
}

.day-cell:hover {
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.day-cell .date {
  font-size: 9px;
  color: #999;
  display: block;
  margin-bottom: 1px;
  line-height: 1;
}

.day-cell .shift {
  font-size: 11px;
  display: block;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

.day-cell.D {
  background: #c8e6c9;
  color: #1b5e20;
  border-color: #81c784;
}

.day-cell.E {
  background: #ffe0b2;
  color: #e65100;
  border-color: #ffb74d;
}

.day-cell.N {
  background: #b3e5fc;
  color: #01579b;
  border-color: #4fc3f7;
}

.day-cell.休 {
  background: #f8bbd0;
  color: #880e4f;
  border-color: #f48fb1;
}

.day-cell.例 {
  background: #ede7f6;
  color: #4a148c;
  border-color: #ce93d8;
}

.day-cell.國 {
  background: #fff9c4;
  color: #f57f17;
  border-color: #fff59d;
}

.day-cell.V {
  background: #ffccbc;
  color: #bf360c;
  border-color: #ffab91;
}

.day-cell.產 {
  background: #d1c4e9;
  color: #311b92;
  border-color: #b39ddb;
}

.day-cell.empty {
  background: #fafafa;
  border-color: #eee;
  cursor: not-allowed;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  margin-top: 20px;
  padding: 15px;
  background: #fafafa;
  border-radius: 4px;
  font-size: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.legend-box {
  width: 20px;
  height: 20px;
  border-radius: 3px;
  border: 1px solid #ccc;
}

.no-data {
  text-align: center;
  padding: 40px;
  color: #999;
  font-size: 14px;
}

@media (max-width: 768px) {
  .app-header {
    flex-direction: column;
    align-items: flex-start;
  }
  
  .app-header h1 {
    width: 100%;
  }
  
  .header-controls {
    width: 100%;
  }
  
  .month-selector {
    width: 100%;
  }
  
  .month-selector select {
    flex: 1;
  }
  
  .logout-btn {
    width: 100%;
  }
  
  .day-cell {
    font-size: 10px;
  }
  
  .day-cell .date {
    font-size: 8px;
  }
  
  .day-cell .shift {
    font-size: 9px;
  }
}

@media (max-width: 480px) {
  .app-screen {
    padding: 10px;
  }
  
  .app-header h1 {
    font-size: 18px;
  }
  
  .day-cell {
    aspect-ratio: auto;
    min-height: 35px;
  }
}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div style="width: 100%;">
    <div class="login-icon">🔐</div>
    <h1>班表查詢系統</h1>
    <div class="subtitle">請輸入密碼和員編登入</div>
    
    <div class="error-msg" id="errorMsg"></div>
    
    <div class="form-group">
      <label>🔑 密碼</label>
      <input type="password" id="passwordInput" placeholder="輸入密碼" onkeypress="if(event.key==='Enter') handleLogin()">
    </div>
    
    <div class="form-group">
      <label>👤 員編</label>
      <input type="text" id="empIdInput" placeholder="例如：10273" onkeypress="if(event.key==='Enter') handleLogin()">
    </div>
    
    <button class="login-button" onclick="handleLogin()">登入</button>
    
    <div class="hint">
      <strong>提示：</strong><br>
      密碼：A030<br>
      輸入員編登入後，可切換月份或重新登入其他員編
    </div>
  </div>
</div>

<div class="app-screen" id="appScreen">
  <div class="app-header">
    <h1>📅 班表查詢</h1>
    <div class="header-controls">
      <div class="month-selector">
        <label for="monthSelect">📆 月份：</label>
        <select id="monthSelect" onchange="loadCalendar()">
          <option value="8">8月</option>
          <option value="9">9月</option>
        </select>
      </div>
      <button class="logout-btn" onclick="handleLogout()">🚪 重新登入</button>
    </div>
  </div>
  
  <div class="user-info" id="userInfo"></div>
  
  <div id="calendarContainer"></div>
</div>

let currentUser = null;

function handleLogin() {
  const password = document.getElementById('passwordInput').value;
  const empId = document.getElementById('empIdInput').value.trim();
  const errorMsg = document.getElementById('errorMsg');
  
  if (!password) {
    showError(errorMsg, '❌ 請輸入密碼');
    return;
  }
  
  if (password !== CORRECT_PASSWORD) {
    showError(errorMsg, '❌ 密碼錯誤');
    document.getElementById('passwordInput').value = '';
    return;
  }
  
  if (!empId) {
    showError(errorMsg, '❌ 請輸入員編');
    return;
  }
  
  if (!EMPLOYEE_DB[empId]) {
    showError(errorMsg, '❌ 員編不存在');
    document.getElementById('empIdInput').value = '';
    return;
  }
  
  currentUser = {
    id: empId,
    name: EMPLOYEE_DB[empId]
  };
  
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.add('visible');
  document.getElementById('userInfo').innerHTML = `
    👋 歡迎，<strong>${currentUser.name}</strong>（員編：${currentUser.id}）
  `;
  
  // 直接顯示8月班表
  document.getElementById('monthSelect').value = '8';
  loadCalendar();
}

function showError(element, message) {
  element.textContent = message;
  element.classList.add('show');
  setTimeout(() => {
    element.classList.remove('show');
  }, 3000);
}

function handleLogout() {
  if (confirm('確定要重新登入其他員編嗎？')) {
    currentUser = null;
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('appScreen').classList.remove('visible');
    document.getElementById('passwordInput').value = '';
    document.getElementById('empIdInput').value = '';
    document.getElementById('errorMsg').classList.remove('show');
    document.getElementById('passwordInput').focus();
  }
}

function loadCalendar() {
  const month = document.getElementById('monthSelect').value;
  const container = document.getElementById('calendarContainer');
  
  const scheduleData = month === '8' ? SCHEDULE_8 : SCHEDULE_9;
  
  if (!scheduleData[currentUser.name]) {
    container.innerHTML = `
      <div class="no-data">
        ⚠️ ${month}月暫無班表數據
      </div>
    `;
    return;
  }
  
  const daysInMonth = month === '8' ? 31 : 30;
  const monthName = month === '8' ? '8月' : '9月';
  
  const firstDate = new Date(2026, month - 1, 1);
  const firstDayOfWeek = firstDate.getDay();
  
  const personalSchedule = scheduleData[currentUser.name];
  
  let html = '<div class="calendar-wrapper">';
  html += '<div class="day-labels">';
  WEEKDAYS.forEach(day => {
    html += `<div class="day-name">${day}</div>`;
  });
  html += '</div>';
  
  let dayCounter = 1;
  
  for (let i = 0; i < firstDayOfWeek; i++) {
    if (i === 0) {
      html += '<div class="calendar-grid">';
    }
    html += '<div class="day-cell empty"></div>';
    dayCounter++;
  }
  
  for (let day = 1; day <= daysInMonth; day++) {
    if ((dayCounter - 1) % 7 === 0) {
      if (dayCounter > 1) {
        html += '</div>';
      }
      html += '<div class="calendar-grid">';
    }
    
    const shift = personalSchedule[day.toString()] || '';
    const shiftClass = getShiftClass(shift);
    
    html += `
      <div class="day-cell ${shiftClass}">
        <span class="date">${day}</span>
        <span class="shift">${shift}</span>
      </div>
    `;
    dayCounter++;
  }
  
  while ((dayCounter - 1) % 7 !== 0) {
    html += '<div class="day-cell empty"></div>';
    dayCounter++;
  }
  
  html += '</div>';
  html += '</div>';
  
  html += `
    <div class="legend">
      <div class="legend-item"><div class="legend-box D"></div> D = 白班</div>
      <div class="legend-item"><div class="legend-box E"></div> E = 小夜班</div>
      <div class="legend-item"><div class="legend-box N"></div> N = 大夜班</div>
      <div class="legend-item"><div class="legend-box 休"></div> 休 = 休息</div>
      <div class="legend-item"><div class="legend-box 例"></div> 例 = 例假</div>
      <div class="legend-item"><div class="legend-box 國"></div> 國 = 國假</div>
      <div class="legend-item"><div class="legend-box V"></div> V = 婚喪病</div>
      <div class="legend-item"><div class="legend-box 產"></div> 產 = 產假</div>
    </div>
  `;
  
  container.innerHTML = html;
}

function getShiftClass(shift) {
  if (!shift) return '';
  const type = shift.replace(/[0-9★]/g, '').trim();
  return type || '';
}

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('passwordInput').focus();
});
